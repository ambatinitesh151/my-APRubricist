
<!DOCTYPE html>
<html lang="en">
<script src="script.jss" defer></script>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>peepeepoopoo</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <main>
        <h1>AP Rubric Grader</h1>
        <p>Just a thing to grade AP-style SAQs for now, more will come<br> Made by Nitesh A.</p>
        


        <!-- Question textbox -->
        <textarea id="QuestionInput" placeholder="Enter the question here:" rows="3"></textarea>
        <br>
        <!-- Response textbox -->
        <textarea id="AnswerInput" placeholder="Enter your response here:" rows="4"></textarea>
        <br>
        <!-- Button after both textboxes -->
        <button id="SubmitButton" type="button">Grade my work!</button>

        <!-- Results section -->
        <section id="Result">
            <h2 id="ResponseScoreSection">Your Response Scored Below Here</h2>
            <p id="QuestionText">Question will appear over here</p>
            <p id="AnswerText">Response will appear over here</p>
            <p id="ScoreText">Score will appear over here</p>
            <p id ="ReasoningText">Reasoning will appear over here</p>
        </section>
    </main>
</body>
</html>
